name: CI

# Gates required by AGENTS §11 and SPEC-d1-migration §8.4 (M2/M4).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/frontend

env:
  WRANGLER_SEND_METRICS: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      # Includes the portability rules P1–P3 (SPEC §3.2).
      - run: npx eslint .
      # The two SPEC §3.2 gates ESLint cannot express (P1 raw-SQL execution, P4 purity).
      - name: P1 — no raw SQL execution outside the swap point
        run: |
          hits=$(grep -rnE '\.(execute|prepare)\(' src --include='*.ts' --include='*.tsx' | grep -v '^src/lib/db/' || true)
          if [ -n "$hits" ]; then
            echo "✖ P1 violation — raw SQL outside src/lib/db/:"
            echo "$hits"
            exit 1
          fi
      - name: P4 — src/core stays pure
        run: |
          hits=$(grep -rnE 'fetch\(|process\.env|Date\.now' src/core --include='*.ts' || true)
          if [ -n "$hits" ]; then
            echo "✖ P4 violation — I/O in src/core:"
            echo "$hits"
            exit 1
          fi

  # M2 (SPEC §1.4): no Neon-era token may return outside the §5.4b allowlist.
  residue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-residue.mjs

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm test

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      # Committed SQL is the migration source of truth (AGENTS §2): a schema edit
      # without a regenerated migration leaves a diff and fails here.
      - run: npx drizzle-kit generate
      - run: git diff --exit-code -- drizzle/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      # Local D1 (workerd) — no Cloudflare credentials, no network.
      - run: npm run test:integration

  # Manual only: needs a Chromium download and boots the Workers preview
  # (`wrangler dev`), which is slower and flakier than the other gates (SPEC R10).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
